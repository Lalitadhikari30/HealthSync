server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript

spring:
  application:
    name: healthsync-backend
  
  # Database Configuration
  datasource:
    url: jdbc:h2:mem:healthsync
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  
  h2:
    console:
      enabled: false
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  
  # JWT Configuration
  jwt:
    secret: ${JWT_SECRET:healthsync-secret-key-change-this-in-production}
    expiration: 86400000  # 24 hours in milliseconds
    issuer: HealthSync

# Application Properties
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:8080
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: '*'
    max-age: 3600
  
  # File Upload Configuration
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    max-file-size: 10MB

# Logging Configuration
logging:
  level:
    root: INFO
    org.springframework: INFO
    com.healthsync: DEBUG

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,mappings
      base-path: /actuator
  endpoint:
    health:
      show-details: always

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method