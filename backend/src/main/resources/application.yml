server:
  port: 8080
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript

spring:
  application:
    name: healthsync-backend
  
  # Firebase Admin SDK Configuration
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  
  # Mail Configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        debug: true

# Firebase Configuration
firebase:
  database-url: ${FIREBASE_DATABASE_URL:https://your-project-id.firebaseio.com}
  project-id: healthsync-7abff
  credentials:
    location: classpath:firebase-credentials.json

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:healthsync-secret-key-change-this-in-production}
  expiration: 86400000  # 24 hours in milliseconds
  issuer: HealthSync

# Application Properties
app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: '*'
    max-age: 3600
  
  # File Upload Configuration
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    max-file-size: 10MB

# Logging Configuration
logging:
  level:
    root: INFO
    org.springframework: INFO
    com.healthsync: DEBUG
    com.google.firebase: INFO

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method